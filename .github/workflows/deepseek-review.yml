name: Gemini Code Review
on: [push]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Debug RouterAI error
        env:
          ROUTERAI_KEY: ${{ secrets.ROUTERAI_KEY }}
        run: |
          python3 -c "
          import os,json,urllib.request
          b=json.dumps({'model':'google/gemini-3.1-pro-preview','messages':[{'role':'user','content':'test'}]})
          req=urllib.request.Request('https://routerai.ru/api/v1/chat/completions',data=b.encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['ROUTERAI_KEY']})
          try:
            r=urllib.request.urlopen(req,timeout=15)
            print(r.read().decode())
          except urllib.error.HTTPError as e:
            print(f'CODE: {e.code}')
            print(f'BODY: {e.read().decode()}')
          "
