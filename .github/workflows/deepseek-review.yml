name: DeepSeek Code Review
on: [push]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run DeepSeek review
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          git diff HEAD~1 -- . > /tmp/d.txt 2>/dev/null || echo "init" > /tmp/d.txt
          python3 -c "
          import os,json,urllib.request
          d=open('/tmp/d.txt').read().strip()[:3000] or 'no diff'
          b=json.dumps({'model':'deepseek-v4-flash','messages':[{'role':'user','content':'Review:\n'+d}]})
          r=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.deepseek.com/chat/completions',data=b.encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['DEEPSEEK_KEY']}),timeout=30).read())
          print(r['choices'][0]['message']['content'])
          "
