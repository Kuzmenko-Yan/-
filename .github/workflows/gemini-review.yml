name: Gemini Code Review

on: [push]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get diff
        run: git diff HEAD~1 > diff.txt

      - name: Ask Gemini to review
        id: gemini
        env:
          ROUTERAI_KEY: ${{ secrets.ROUTERAI_KEY }}
        run: |
          DIFF=$(cat diff.txt | head -500)
          JSON=$(jq -n --arg diff "$DIFF" '{
            model: "google/gemini-3.1-pro-preview",
            messages: [
              {role: "user", content: "Проверь код-ревью этих изменений (коротко, на русском):\n\n" + $diff}
            ]
          }')
          curl -s https://routerai.ru/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ROUTERAI_KEY" \
            -d "$JSON" > response.json
          cat response.json | jq -r '.choices[0].message.content'
