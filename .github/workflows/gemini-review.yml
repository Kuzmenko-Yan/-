name: Gemini Code Review

on: [push]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ask Gemini to review
        env:
          ROUTERAI_KEY: ${{ secrets.ROUTERAI_KEY }}
        run: |
          git diff HEAD~1 -- . > /tmp/diff.txt 2>/dev/null || echo "Initial" > /tmp/diff.txt
          python3 << 'EOF'
import os, json, urllib.request

with open("/tmp/diff.txt") as f:
    diff = f.read().strip()

if not diff or diff == "Initial":
    diff = "Initial commit (no previous diff)"

body = json.dumps({
    "model": "google/gemini-3.1-pro-preview",
    "messages": [{"role": "user", "content": f"Короткое ревью кода на русском:\n\n{diff[:3000]}"}]
})
req = urllib.request.Request(
    "https://routerai.ru/v1/chat/completions",
    data=body.encode(),
    headers={"Content-Type": "application/json",
             "Authorization": "Bearer " + os.environ["ROUTERAI_KEY"]}
)
resp = json.loads(urllib.request.urlopen(req, timeout=30).read())
print(resp["choices"][0]["message"]["content"])
EOF
